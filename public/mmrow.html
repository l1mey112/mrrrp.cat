<!DOCTYPE html>
<html>
<head>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        img { cursor: pointer; max-width: 90%; }
    </style>
</head>
<body>
    <img id="img" src="media/jogn.jpeg">

    <script>
        let meows = [];
        for (let i = 0; i <= 6; i++) {
            meows.push(`media/meow${i}.mp3`);
        }

        // meow stacking and no meowmory leaks
        document.getElementById('img').onclick = () => {
            const meowmoew = document.createElement("audio");
            meowmoew.src = meows[Math.floor(Math.random() * meows.length)];
            document.body.appendChild(meowmoew);
            meowmoew.play();
            meowmoew.addEventListener("ended", (e) => {
                e.target.remove();
            });
        };

    </script>
</body>
</html>
