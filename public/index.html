<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
        <title>mrrrp.cat</title>
        <style>
            html {
                min-height: 100vh;
                background: repeating-linear-gradient(90deg in hsl longer hue, red 0 50%) 0 / 200%;
                animation: r 1s linear infinite;
            }

            @keyframes r {
                to {
                    background-position: 100%;
                }
            }
        </style>
        <style>
            /* mouse effect stuff */
            body {
                margin: 0;
                min-height: 100vh;
                background: #111;
                color: white;
                overflow: hidden;
                cursor: crosshair;
                justify-content: center; 
                align-items: center;
            }

            .star, .word {
                position: fixed;
                pointer-events: none;
                user-select: none;
            }

            .star {
                animation: fall 900ms linear forwards;
            }

            .word {
                font: bold 24px sans-serif;
                animation: vanish 1.5s ease-out forwards;
            }

            @keyframes fall {
                from {
                    transform: translate(0, 0) rotate(0);
                    opacity: 1;
                }
                to {
                    transform: translate(var(--x), 70px) rotate(180deg);
                    opacity: 0;
                }
            }

            @keyframes vanish {
                from {
                    transform: scale(1) rotate(0) skew(0);
                    opacity: 1;
                }
                to {
                    transform: scale(var(--size)) rotate(var(--rotate)) skew(var(--skew));
                    opacity: 0;
                }
            }
        </style>
        <style>
            #commentCanvas {
                position: fixed;
                right: 20px;
                bottom: 20px;
                width: 880px;
                height: 480px;
                overflow: hidden;
                border: 3px solid #222;
                background:
                    radial-gradient(#0001 1px, transparent 1px), #f4e7bd;
                background-size: 8px 8px;
                box-shadow: 5px 5px 0 #222;
                cursor: crosshair;
            }

            .comment {
                position: absolute;
                max-width: 150px;
                padding: 8px 12px;
                color: #111;
                background: #fff8d8;
                border: 2px solid #111;
                border-radius: 4px;
                font: bold 13px Georgia, serif;
                line-height: 1.1;
                transform: rotate(var(--rotation));
                box-shadow: 3px 3px 0 #111;
            }

            .comment::after {
                content: "";
                position: absolute;
                left: 12px;
                bottom: -10px;
                width: 16px;
                height: 16px;
                background: #fff8d8;
                border-right: 2px solid #111;
                border-bottom: 2px solid #111;
                transform: rotate(45deg);
            }

            #commentInput {
              position: absolute;
              z-index: 2;
              padding: 7px;
              width: fit-content;
              background: #fff8d8;
              border: 2px solid #111;
              font: 13px Georgia, serif;
            }

            #commentInput textarea {
              width: 140px;
              min-height: 45px;
              padding: 5px;
              resize: none;
              box-sizing: border-box;
              border: 1px solid #111;
              background: transparent;
              font: inherit;
              outline: none;
            }

            #commentInput #post {
              margin-top: 5px;
              padding: 3px 8px;
              border: 1px solid #111;
              background: #222;
              color: white;
              cursor: pointer;
            }

            #commentInput #close {
              margin-top: 5px;
              float: right;
              padding: 3px 8px;
              border: 1px solid #111;
              background: #222;
              color: white;
              cursor: pointer;
            }
        </style>

        <!-- todo replace "mrrrrrrrrrrrrpppp" with a real description -->

    <body>
        <script>
            const texts = ["mrrrp", "meow", "miau", "☆", "boop", "mrrow", "purr", "hiss", "roar", "mrr", "fucking dies"];

            document.onpointermove = e => {
                if (Math.random() > .35) return;

                const star = document.createElement("span");
                star.className = "star";
                star.textContent = "★";
                star.style.left = e.clientX + "px";
                star.style.top = e.clientY + "px";
                star.style.color = `hsl(${Math.random() * 360},100%,65%)`;
                star.style.fontSize = 8 + Math.random() * 14 + "px";
                star.style.setProperty("--x", Math.random() * 50 - 25 + "px");
                document.body.append(star);
                star.onanimationend = () => star.remove();
            };

            document.onclick = e => {
                const word = document.createElement("span");

                word.className = "word";
                word.textContent = texts[Math.random() * texts.length | 0];
                word.style.left = e.clientX + "px";
                word.style.top = e.clientY + "px";
                word.style.color = `hsl(${Math.random() * 360},100%,70%)`;

                word.style.setProperty("--size", .5 + Math.random() * 2);
                word.style.setProperty("--stretch", .5 + Math.random() * 2);
                word.style.setProperty("--rotate", Math.random() * 360 - 180 + "deg");
                word.style.setProperty("--skew", Math.random() * 60 - 30 + "deg");

                document.body.append(word);
                word.onanimationend = () => word.remove();
            };
        </script>

        <div id="commentCanvas"></div>

        <script>
            const canvas = document.querySelector("#commentCanvas");

            function addComment(data) {
                const comment = document.createElement("div");

                comment.className = "comment";
                comment.textContent = data.text;
                comment.style.left = `${data.x}px`;
                comment.style.top = `${data.y}px`;
                comment.style.setProperty(
                    "--rotation",
                    `${data.rotation}deg`
                );

                canvas.append(comment);
            }
            window.onload = e => {
                fetch("/comments")
                    .then(response => response.json())
                    .then(comments => {
                        comments.forEach(addComment);
                    });
            }

            canvas.onclick = e => {
                if(document.querySelector("#commentInput")) return;
                const input = document.createElement("div");

                input.id = "commentInput";
                input.style.left = `${e.offsetX}px`;
                input.style.top = `${e.offsetY}px`;

                input.innerHTML = `
                    <textarea rows="3" placeholder="ComMENt pls"></textarea>
                    <br>
                    <button id="post">Post</button>
                    <button id="close">Close</button>
                `;

                canvas.append(input);

                const textarea = input.querySelector("textarea");
                textarea.focus();

                input.querySelector("#close").onclick = event => {
                    event.stopPropagation();
                    input.remove();
                }

                post.onclick = event => {
                    event.stopPropagation();

                    const text = textarea.value.trim();

                    if (!text) return;

                    const data = {
                        text: text,
                        x: parseFloat(input.style.left),
                        y: parseFloat(input.style.top),
                        rotation: Math.random() * 8 - 4
                    };

                    fetch("/comments", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(data)
                    })
                        .then(response => {
                            if (!response.ok) {
                                throw new Error("Could not save comment");
                            }

                            return response.json();
                        })
                        .then(savedComment => {
                            addComment(savedComment);
                            input.remove();
                        })
                        .catch(error => {
                            console.error(error);
                            alert("The comment could not be saved.");
                        });
                };
            };
        </script>
