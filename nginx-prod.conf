load_module modules/ngx_http_js_module.so;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # libnginx-mod-http-js in debian
    js_engine qjs;
    js_import main from webring.js;

    server {
        listen 80;
        listen [::]:80;
        server_name mrrrp.cat;
        root /var/www/html;

        location = /wrnext { js_content main.wrnext; }
        location = /wrprev { js_content main.wrprev; }

        include http.conf;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name www.mrrrp.cat;

        return 301 https://mrrrp.cat$request_uri;
    }
}
