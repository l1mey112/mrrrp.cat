apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mrrrp-website
  namespace: mrrrp-website
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment
  namespace: mrrrp-website
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      component: deployment
  template:
    metadata:
      labels:
        component: deployment
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: nginx
          image: ghcr.io/l1mey112/mrrrp:latest
          command: ["sh", "-c", "until [ -f Makefile ] && [ -f nginx.conf ]; do sleep 2; done; exec make"]
          workingDir: /app
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            httpGet: { path: /, port: 8080 }
          volumeMounts:
            - name: app
              mountPath: /app
      volumes:
        - name: app
          persistentVolumeClaim:
            claimName: mrrrp-website
---
apiVersion: v1
kind: Service
metadata:
  name: service
  namespace: mrrrp-website
spec:
  ports:
    - port: 80
      targetPort: 8080
  selector:
    component: deployment
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress
  namespace: mrrrp-website
spec:
  ingressClassName: traefik
  rules:
    - host: mrrrp.cat
      http: &website
        paths:
          - backend:
              service:
                name: service
                port:
                  number: 80
            path: /
            pathType: Prefix
    - host: www.mrrrp.cat
      http: *website
