name: prod
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency: prod

permissions:
  contents: read
  deployments: write

env:
  NS: mrrrp-website

jobs:
  check-nginx:
    runs-on: mrrrp-set
    steps:
      - uses: actions/checkout@v4

      - name: check nginx config
        run: |
          nginx -t -p "$PWD/ngx" -c nginx.conf \
            -g 'load_module /usr/lib/nginx/modules/ngx_http_js_module.so;'

  deploy:
    needs: check-nginx
    runs-on: mrrrp-set
    environment:
      name: production
      url: https://mrrrp.cat
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v4

      - name: apply
        run: kubectl apply -k .github

      - name: wait
        run: |
          for _ in $(seq 1 120); do
            POD=$(kubectl get pod -n "$NS" -l component=deployment -o jsonpath='{.items[?(@.status.containerStatuses[0].ready==true)].metadata.name}' | awk '{print $1}')
            [ -n "$POD" ] && break
            sleep 1
          done
          test -n "$POD"

      # https://serverfault.com/questions/741670/rsync-files-to-a-kubernetes-pod
      # https://gist.github.com/avoidik/768b1ce51497a9f212ca7426e591baf9
      - name: sync
        run: |
          POD=$(kubectl get pod -n "$NS" -l component=deployment -o jsonpath='{.items[?(@.status.containerStatuses[0].ready==true)].metadata.name}' | awk '{print $1}')
          test -n "$POD"
          RSH=$(mktemp); printf '#!/bin/sh\npod=$1; shift\nexec kubectl exec -i -n %s "$pod" -- "$@"\n' "$NS" > "$RSH"; chmod +x "$RSH"
          rsync --blocking-io -rlt --delete --omit-dir-times --no-owner --no-group \
            --exclude=.git --exclude=data --exclude=logs --exclude=node_modules \
            -e "$RSH" ./ "$POD:/app/"

      - name: restart
        run: |
          kubectl rollout restart -n $NS deploy/deployment
          kubectl rollout status -n $NS deploy/deployment --timeout=120s

  tail:
    needs: deploy
    runs-on: mrrrp-set
    steps:
      - uses: azure/setup-kubectl@v4

      - run: timeout 30 kubectl logs -f -n $NS deploy/deployment --tail=50 || [ $? -eq 124 ]
