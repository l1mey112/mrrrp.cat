name: prod
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency: prod

permissions:
  contents: read
  deployments: write

env:
  NS: mrrrp-website

jobs:
  check-nginx:
    runs-on: mrrrp-set
    steps:
      - uses: actions/checkout@v4

      - name: check nginx config
        run: |
          sudo -n podman --cgroup-manager=cgroupfs pull ghcr.io/l1mey112/mrrrp:latest
          sudo -n podman --cgroup-manager=cgroupfs run --rm --network=host --user 0 \
            -v "$PWD:/app:ro" \
            ghcr.io/l1mey112/mrrrp:latest \
            sh -c '
              NJS=$(find /usr/lib /usr/lib64 -name ngx_http_js_module.so -print -quit)
              test -n "$NJS"
              nginx -t -p /app/ngx -c nginx.conf -g "load_module $NJS;"
            '

  deploy:
    needs: check-nginx
    runs-on: mrrrp-set
    environment:
      name: production
      url: https://mrrrp.cat
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v4

      - name: apply
        run: kubectl apply -k .github

      - name: wait
        run: kubectl wait -n $NS --for=jsonpath='{.status.phase}'=Running pod -l component=deployment --timeout=120s

      # https://serverfault.com/questions/741670/rsync-files-to-a-kubernetes-pod
      # https://gist.github.com/avoidik/768b1ce51497a9f212ca7426e591baf9
      - name: sync
        run: |
          POD=$(kubectl get pod -n $NS -l component=deployment -o jsonpath='{.items[0].metadata.name}')
          RSH=$(mktemp); printf '#!/bin/sh\npod=$1; shift\nexec kubectl exec -i -n %s "$pod" -- "$@"\n' "$NS" > "$RSH"; chmod +x "$RSH"
          rsync --blocking-io -rlt --delete --omit-dir-times --no-owner --no-group \
            --exclude=.git --exclude=data --exclude=logs --exclude=node_modules \
            -e "$RSH" ./ "$POD:/app/"

      - name: restart
        run: |
          kubectl rollout restart -n $NS deploy/deployment
          kubectl rollout status -n $NS deploy/deployment --timeout=120s

  tail:
    needs: deploy
    runs-on: mrrrp-set
    steps:
      - uses: azure/setup-kubectl@v4

      - run: timeout 30 kubectl logs -f -n $NS deploy/deployment --tail=50 || [ $? -eq 124 ]
